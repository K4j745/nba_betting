name: Weekly evaluation

# Co tydzień: ewaluacja walk-forward modelu na liniach z odds_history
# (evaluate.py) → reports/eval_<data>.* → sekcja „Model vs rynek” na dashboardzie.
on:
  schedule:
    - cron: '0 10 * * 1'   # poniedziałek 10:00 UTC
  workflow_dispatch:

# Ta sama grupa co pipeline — oba commitują do main, nie mogą biec równolegle
concurrency:
  group: nba-pipeline
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout danych NBA (branch data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/raw

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Zbiór z cechami (offline, z data/raw)
        run: python history.py --offline

      - name: Ewaluacja walk-forward
        run: python evaluate.py

      - name: Commit raportu
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if ! git diff --staged --quiet; then
            git commit -m "data: raport ewaluacji $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --no-rebase --no-edit origin main
            git push
          else
            echo "Brak zmian w raporcie."
          fi
