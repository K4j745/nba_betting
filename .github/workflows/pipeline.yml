name: NBA Betting Pipeline

on:
  schedule:
    # Pipeline dzienny — 21:30 UTC = 16:30 ET (zima) / 17:30 ET (lato), przed meczami o 19:00 ET.
    # Późno, bo raport kontuzji NBA o tej porze ma ~70% nieobecnych (o 13:00 ET ~58%).
    - cron: '30 21 * * *'
    # Weryfikacja — 09:00 CEST = 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tryb uruchomienia'
        required: true
        default: pipeline
        type: choice
        options:
          - pipeline   # generuje kupon + dashboard_data.json
          - verify     # weryfikuje wczorajsze wyniki (punkty z data/raw)

# Zapobiega równoległym uruchomieniom — jeden job na raz
concurrency:
  group: nba-pipeline
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Uruchomienie pipeline i commit danych do repo
  # ────────────────────────────────────────────────────────────────────────────
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # git push z danymi

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # fetch-depth 0 potrzebny do push'a z historią
          fetch-depth: 0

      # Logi NBA z brancha `data` (synchronizowane z laptopa — stats.nba.com
      # nie odpowiada runnerom GitHub Actions). data/ jest w .gitignore.
      - name: Checkout danych NBA (branch data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/raw

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Pipeline dzienny (21:30 UTC) ──────────────────────────────────────
      - name: Run pipeline — generuj kupon
        if: >-
          github.event.schedule == '30 21 * * *' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'pipeline')
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py --run-now

      # ── Weryfikacja (09:00 CEST) ───────────────────────────────────────────
      - name: Run verify — weryfikuj wczoraj
        if: >-
          github.event.schedule == '0 7 * * *' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py --verify-only

      # ── Commit danych z powrotem do repo ────────────────────────────────────
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add pliki które mogły być w .gitignore wcześniej
          git add -f nba_betting.db             2>/dev/null || true
          git add -f models/regressor_v*.pkl    2>/dev/null || true
          git add -f models/classifier_v*.pkl   2>/dev/null || true
          git add    dashboard_data.json        2>/dev/null || true
          git add    upcoming.json              2>/dev/null || true
          git add    "coupon_*.json"            2>/dev/null || true

          # Commit tylko jeśli są zmiany; [skip ci] zapobiega pętli
          if ! git diff --staged --quiet; then
            git commit -m "data: pipeline $(date -u +'%Y-%m-%dT%H:%M')Z [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Brak zmian do commitowania."
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy dashboardu na GitHub Pages (wspólny workflow pages.yml)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: pipeline
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
